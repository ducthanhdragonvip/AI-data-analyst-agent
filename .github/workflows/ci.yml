name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst -d analyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://analyst:analyst@localhost:5432/analyst
      SYNC_DATABASE_URL: postgresql+psycopg://analyst:analyst@localhost:5432/analyst
      STORAGE_DIR: backend/storage
      UPLOAD_DIR: backend/storage/uploads
      ARTIFACT_DIR: backend/storage/artifacts
      CHROMA_PATH: backend/storage/chroma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t ai-data-analyst-agent:ci .
